name: CPower, Inc.
description: >-
  CPower Energy is a commercial and industrial (C&I) virtual power plant (VPP)
  operator that helps organizations monetize the flexibility of their energy
  assets through demand response and distributed energy resource (DER) programs.
  Its CPower CONNECT platform lets customers view, manage, and unlock revenue
  from energy assets while supporting grid reliability and sustainability goals.
  CPower serves data centers, crypto mining, healthcare, education, retail,
  commercial real estate, industrial operations, and the public sector, and has
  operated distributed energy programs across the U.S. since 2015. CPower was
  acquired by NRG Energy and operates a combined C&I VPP platform. This profile
  was surfaced as a portfolio-adjacent deep-tech lead and enriched by the API
  Evangelist pipeline; CPower publishes a customer portal and a security and
  compliance posture but no public developer API at this time.
